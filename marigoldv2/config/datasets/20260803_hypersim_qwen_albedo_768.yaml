hypersim_train_albedo_qwen_768:
  name: GenericDataset
  disp_name: hypersim_train_albedo_qwen_768
  sampling_weight: 1.0
  manifest_cfg:
    name: GenericManifest
    manifest_graph:
      - LoadHypersimAlbedoManifest:
          base_dir: ${oc.env:HYPERSIM_ALBEDO_DATASET_DIR,${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets/marigold_train_albedo}
          split: train
          source_split: train
          selection: exclude_holdout
          holdout_samples: 200
          seed: 42
          verify_files: true
  transform:
    - ReadRGBImage:
        key: rgb_path
        name: rgb
        use_rel_dir: false
        set_as_orig_res: true
        save_orig: true
    - ReadRGBAlbedoNpy:
        key: albedo_path
        output_key: albedo_gt
        mask_key: valid_mask
    - RandomHorizontalFlipAlbedo:
        p: 0.5
        include_keys: [rgb_norm, rgb_int, albedo_gt, valid_mask]
    - ResizeRGBAlbedo:
        height: 576
        width: 768
        rgb_keys: [rgb_norm, rgb_int]
        albedo_key: albedo_gt
        mask_key: valid_mask

