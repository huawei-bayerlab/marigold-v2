# ---- Base configs (dataset definitions) ----
base_config:
  - marigoldv2/config/datasets/20260803_hypersim_qwen_albedo_768.yaml

register_modules:
- marigoldv2.dataset.generic_dataset
- marigoldv2.dataset.dataloading.transform
- marigoldv2.dataset.manifest.manifest
- marigoldv2.dataset.manifest.manifest_transforms
- marigoldv2.validation.validate_steps
- marigoldv2.loss.loss
- marigoldv2.experiments.20260316_qwen_depth.network_graph
- marigoldv2.experiments.20260316_qwen_depth.component_loader
- marigoldv2.experiments.20260803_qwen_albedo.data
- marigoldv2.experiments.20260803_qwen_albedo.network_graph
- marigoldv2.experiments.20260803_qwen_albedo.loss
- marigoldv2.experiments.20260803_qwen_albedo.validation

masked_albedo_l1_loss_weight: 1.0
irepa_dinov3_spatial_loss_weight: 0.2
irepa_teacher_input_key: albedo_gt
irepa_teacher_input_range: '01'
irepa_dinov3_model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
irepa_dinov3_input_size: 224
irepa_spatial_norm_gamma: 0.7
irepa_token_l1_weight: 1.0
irepa_pairwise_weight: 1.0
irepa_max_tokens_for_pairwise: 256
irepa_use_student_projection: true
irepa_projection_type: conv3x3
irepa_student_feature_dim: 64
irepa_teacher_feature_dim: 768

scale: 1.0
logging:
  console_log: ${mul:${scale},20}
  file_log: ${mul:${scale},10}
paths:
  use_paths_from: env_paths
  env_paths:
    base_data_dir: ${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets
    out_dir: output/train_runs
    embed_dir: ${oc.env:DEPTH_ASSETS_DIR,./assets}/checkpoints/Marigold-V2/qwen_text_embeddings
    ckpt_qwen_image_edit: ${oc.env:DEPTH_ASSETS_DIR,./assets}/checkpoints/Qwen-Image-Edit-2509
dataloader:
  effective_batch_size: 1
  max_train_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  seed: 2025
dataset:
  train:
    hypersim_train_albedo_qwen_768: ${hypersim_train_albedo_qwen_768}
  val:
    hypersim_val_albedo_qwen_768: ${hypersim_val_albedo_qwen_768}
  vis:
    hypersim_vis_albedo_qwen_768: ${hypersim_vis_albedo_qwen_768}
trainer:
  name: GenericTrainer
  dtype: torch.bfloat16
eval:
  eval_metrics: []
validation:
  main_val_metric: albedo_mae
  main_val_metric_goal: minimize
  file_path_key: rgb_path
network_components:
- LoadQwenImageEditVAE:
    name: VAE
    train_decoder: true
- LoadQwenImageEditTransformerFlexible:
    name: Diffuser
network_graph:
  QwenImageEncode:
    kwargs:
      input_key: rgb_norm
      output_key: lat_encoding
  QwenImageEdit2509Step:
    kwargs:
      prefix: qwen_edit_2509_qwen_albedo_rgb_dummy512
      predict_eps: false
      predict_vel: true
      timestep: 0.499
      capture_hidden_states: true
      hidden_state_indices:
      - -1
      - -8
      hidden_state_key_prefix: qwen_dit_hidden_state
  QwenImageDecode:
    kwargs:
      input_key: lat_encoding
      output_key: pixel_pred
  RGBAlbedoPrediction:
    kwargs:
      input_key: out/pixel_pred
      output_key: albedo_pred
loss_graph:
  MaskedRGBAlbedoL1Loss:
    pred_key: out/albedo_pred
    gt_key: albedo_gt
    mask_key: valid_mask
    weight: ${masked_albedo_l1_loss_weight}
    loss_name: masked_rgb_albedo_l1_loss
  IREPADinoV3SpatialLoss:
    pred_key: out/albedo_pred
    gt_key: albedo_gt
    teacher_input_key: ${irepa_teacher_input_key}
    prediction_input_range: '01'
    teacher_input_range: ${irepa_teacher_input_range}
    mask_key: valid_mask
    weight: ${irepa_dinov3_spatial_loss_weight}
    loss_name: irepa_dinov3_gt_albedo_spatial_loss
    model_name: ${irepa_dinov3_model_name}
    input_size: ${irepa_dinov3_input_size}
    gamma: ${irepa_spatial_norm_gamma}
    token_l1_weight: ${irepa_token_l1_weight}
    pairwise_weight: ${irepa_pairwise_weight}
    max_tokens_for_pairwise: ${irepa_max_tokens_for_pairwise}
    student_feature_keys:
    - out/qwen_dit_hidden_state_-1
    - out/qwen_dit_hidden_state_-8
    student_feature_weights:
    - 1.0
    - 0.7
    use_student_projection: ${irepa_use_student_projection}
    projection_type: ${irepa_projection_type}
    student_feature_dim: ${irepa_student_feature_dim}
    teacher_feature_dim: ${irepa_teacher_feature_dim}
    projection_component_name: iREPAStudentProjector
    use_cached_gt_tokens: false
optimization:
  max_iter: ${mul:${scale},30000}
  max_epoch: ${mul:${scale},100000}
  vis_period: ${mul:${scale},2000}
  vis_points: []
  val_period: ${mul:${scale},2000}
  val_points: []
  ckpt_points: ${scale_list:${scale},5000,10000,15000,20000,25000,30000}
  max_grad_norm: 1.0
  scheduler:
    name: three_phase_linear
    base_lr: 5.0e-05
    warmup_steps: ${mul:${scale},200}
    start_factor: 0.01
    decay_steps: ${mul:${scale},20000}
    final_factor: 0.1
  quantization:
    level: 4bit
    skip_modules:
    - transformer_blocks.0.img_mod
    dequantize_modules:
    - proj_out
  lora:
    rank: 128
    lora_alpha: 128
    lora_dropout: 0.0
    init_lora_weights: gaussian
    target_modules:
    - img_in
    - txt_in
    - to_q
    - to_k
    - to_v
    - to_out.0
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.add_q_proj
    - attn.to_add_out
    - norm.linear
    - a_to_out
    - b_to_out
    - img_mlp.net.0.proj
    - img_mlp.net.2
    - txt_mlp.net.0.proj
    - txt_mlp.net.2
    - ff_a.0
    - ff_a.2
    - ff_b.0
    - ff_b.2
    - norm_out.linear
    - proj_out
